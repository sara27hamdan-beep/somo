<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلمة - النتائج</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Cairo',sans-serif; background:#2b1710; min-height:100vh;padding:40px 20px;color:#f5e9d7;}
  .container{max-width:1000px;margin:0 auto;background:#3b2416; border:1px solid #d4af37;border-radius:24px;padding:30px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid #d4af37;padding-bottom:15px; flex-wrap: wrap; gap: 10px;}
  h1{color:#f0d98c; font-size: 1.5rem;}
  .btn-group{display: flex; gap: 10px;}
  
  .refresh-btn{background:linear-gradient(135deg,#f0d98c,#d4af37);color:#2b1710;border:none;padding:10px 20px;border-radius:12px;font-family:'Cairo';font-weight:800;cursor:pointer; transition: 0.2s;}
  .refresh-btn:hover{transform:translateY(-2px);}
  
  .clear-btn{background:linear-gradient(135deg,#ff6b6b,#d04a5e);color:white;border:none;padding:10px 20px;border-radius:12px;font-family:'Cairo';font-weight:800;cursor:pointer; transition: 0.2s;}
  .clear-btn:hover{transform:translateY(-2px); box-shadow: 0 4px 15px rgba(208, 74, 94, 0.4);}

  table{width:100%;border-collapse:collapse;text-align:right;}
  th, td{padding:15px;border-bottom:1px solid #5a3a24;}
  th{color:#d4af37;background:rgba(0,0,0,0.2);}
  tr:hover td{background:rgba(212,175,55,0.05);}
  .img-cell img{width:45px;height:45px;object-fit:contain;}
  .score{color:#7ee2a8;font-weight:800;}
  .cheat-yes{color:#ff8fa3;font-weight:800; background: rgba(208,74,94,0.2); padding: 5px 10px; border-radius: 8px;}
  .cheat-no{color:#7ee2a8;}
  .loader{text-align:center;padding:40px;color:#d4af37; font-size: 1.2rem;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>👩‍🏫 لوحة تحكم المعلمة</h1>
    <div class="btn-group">
      <button class="refresh-btn" onclick="fetchData()">تحديث النتائج 🔄</button>
      <button class="clear-btn" onclick="clearAllData()">مسح جميع السجلات 🗑️</button>
    </div>
  </div>
  <table>
    <thead>
      <tr><th>الشخصية</th><th>أسماء الثنائي</th><th>الدرجة</th><th>محاولات الغش</th><th>وقت الإنهاء</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
function fetchData() {
  const tbody = document.getElementById("tableBody");
  // جلب البيانات من ذاكرة المتصفح
  const data = JSON.parse(localStorage.getItem("quiz_results")) || [];

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="loader">لا توجد نتائج مسجلة على هذا المتصفح حتى الآن.</td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  // عرض البيانات من الأحدث للأقدم
  data.slice().reverse().forEach(row => {
    const tr = document.createElement("tr");
    const date = new Date(row.time).toLocaleString('ar-EG');
    const cheatText = row.cheats > 0 ? `⚠️ ${row.cheats} مرات` : `✅ لا يوجد`;
    const cheatClass = row.cheats > 0 ? "cheat-yes" : "cheat-no";
    tr.innerHTML = `
      <td class="img-cell"><img src="${row.img}"></td>
      <td><strong>${row.names}</strong></td>
      <td class="score">${row.score}</td>
      <td class="${cheatClass}">${cheatText}</td>
      <td style="font-size:0.85rem;">${date}</td>
    `;
    tbody.appendChild(tr);
  });
}

// دالة مسح جميع السجلات
function clearAllData() {
  if (confirm("هل أنتِ متأكدة من مسح جميع النتائج؟ لا يمكن التراجع عن هذه الخطوة.")) {
    localStorage.removeItem("quiz_results");
    fetchData(); // تحديث الجدول ليكون فارغاً
  }
}

// جلب البيانات عند فتح الصفحة
document.addEventListener("DOMContentLoaded", fetchData);
</script>
</body>
</html>
